name: Actualizar eventos CDMX
on:
  workflow_dispatch:
  schedule:
    - cron: '15 12 * * *' # 06:15 CDMX en horario UTC-6
permissions:
  contents: write
concurrency:
  group: radar-feed
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sincronizar datos
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: python scripts/sync_events.py
      - name: Publicar datos actualizados
        run: |
          if ! git diff --quiet -- data/events.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/events.json
            git commit -m 'Actualizar catálogo de eventos CDMX'
            git push
          fi
